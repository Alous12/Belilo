[build]
  command = "npm --prefix backend ci && npm --prefix frontend ci && npm --prefix frontend run build"
  publish = "frontend/dist/belilo/browser"

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "firebase-admin", "@netlify/blobs", "serverless-http"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
